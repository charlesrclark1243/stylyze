<mat-toolbar class="toolbar">
  <mat-icon>palette</mat-icon>
  <span class="brand">stylyze</span>
</mat-toolbar>

<main>
  <header class="intro">
    <h1>stylyze</h1>
    <p>Pick a photo and a style, and a neural network repaints the photo in that style.</p>
  </header>

  <div class="pickers">
    <app-image-picker label="Content" (fileSelected)="content.set($event)" />
    <app-image-picker label="Style" [presets]="stylePresets" (fileSelected)="style.set($event)" />
  </div>

  <button matButton="filled" [disabled]="!content() || !style() || loading()" (click)="stylyze()">
    {{ loading() ? 'Stylizing…' : 'Stylize' }}
  </button>

  @if (loading()) {
    <mat-progress-bar mode="indeterminate" />
  }

  @if (result(); as images) {
    <section class="result">
      <h2>Result</h2>
      <app-compare-slider [before]="images.before" [after]="images.after" />
      <a matButton="outlined" [href]="images.after" download="stylyzed.jpg">
        <mat-icon>download</mat-icon>
        Download
      </a>
    </section>
  }
</main>
