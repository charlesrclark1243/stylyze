set_real_ip_from 172.16.0.0/12; # docker's bridge networks
real_ip_header X-Forwarded-For;
real_ip_recursive on;

limit_req_zone $binary_remote_addr zone=stylyze:10m rate=6r/m;

server {
    listen 80;
    root /usr/share/nginx/html;

    resolver 127.0.0.11 valid=10s;

    client_max_body_size 25M;
    client_body_buffer_size 2M;

    location /api/ {
        set $backend http://backend:8000;
        proxy_pass $backend;
        proxy_read_timeout 120s; # inference takes ~10s on CPU, longer when queued.

        limit_req zone=stylyze burst=2 nodelay; # allow bursts of 2 requests
        limit_req_status 429;
    }

    location /health {
        set $backend http://backend:8000;
        proxy_pass $backend;
    }

    location / {
        # Prerendered pages first, then the client-side app for any other route
        try_files $uri $uri/index.html /index.csr.html;
    }
}