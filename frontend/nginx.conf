server {
    listen 80;
    root /usr/share/nginx/html;

    # Two uploads of up to 10 MB each; nginx default limit is 1 MB
    client_max_body_size 25M;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_read_timeout 120s; # inference takes ~10s on CPU, longer when queued.
    }

    location /health {
        proxy_pass http://backend:8000;
    }

    location / {
        # Prerendered pages first, then the client-side app for any other route
        try_files $uri $uri/index.html /index.csr.html;
    }
}